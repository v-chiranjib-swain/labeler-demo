name: Temporary labeler edge-case check

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-target-pr:
    if: github.event.pull_request.head.ref == 'feature/986-event-target' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: chiranjib-swain/labeler@fix/986-dispatch-branch-matching
        with:
          configuration-path: .github/labeler-986-edge.yml
          pr-number: '19'
          sync-labels: true
