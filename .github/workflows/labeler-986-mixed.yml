name: Temporary labeler mixed-rule check

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  mixed-rule:
    runs-on: ubuntu-latest
    steps:
      - uses: chiranjib-swain/labeler@fix/986-dispatch-branch-matching
        with:
          configuration-path: .github/labeler-986-mixed.yml
          pr-number: '38'
          sync-labels: false
