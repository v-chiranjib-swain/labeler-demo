name: CLICK manual labeling

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: chiranjib-swain/labeler@fix/986-dispatch-branch-matching
        with:
          pr-number: ${{ inputs.pr_number }}
